# Builds and pushes ghcr.io/makurosolusi/webterm on a version tag. The image is smoke-tested (healthcheck,
# claude, Chrome binary, custom-command PATH; no real page) BEFORE anything is pushed.
name: docker-publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/makurosolusi/webterm

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Home seeding never overwrites (no Docker needed)
        run: bash docker/seed-home.test.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION

      # Native-arch image for the smoke test (loaded into the local daemon, not pushed).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: webterm:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/ws"
          chmod 777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/ws"
          docker run -d --name webterm-smoke --init --restart unless-stopped \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt seccomp=docker/chrome.seccomp.json --shm-size 1g \
            -e WEBTERM_BROWSER=on \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/ws:/workspace" \
            --health-cmd 'curl -s -o /dev/null --max-time 3 http://127.0.0.1:8700/api/health' \
            --health-interval 5s --health-retries 12 --health-start-period 10s \
            webterm:smoke
          ok=0
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' webterm-smoke)" = healthy ] && { ok=1; break; }
            sleep 3
          done
          if [ "$ok" != 1 ]; then docker logs webterm-smoke; echo "never healthy" >&2; exit 1; fi
          docker exec webterm-smoke claude --version
          docker exec webterm-smoke sh -c '"$WEBTERM_BROWSER_BIN" --version'
          for flags in -lc -ic; do
            path="$(docker exec webterm-smoke bash "$flags" 'echo "$PATH"' 2>/dev/null)"
            case "$path" in /data/custom-bin:/opt/custom/bin:*:/home/webterm/.local/bin:*|/data/custom-bin:/opt/custom/bin:/home/webterm/.local/bin:*) ;; *) echo "bash $flags PATH is $path" >&2; exit 1 ;; esac
          done

      - name: Server really started (no restarts, no boot errors)
        run: |
          [ "$(docker inspect -f '{{.RestartCount}}' webterm-smoke)" = 0 ] || { echo "container restarted" >&2; docker logs webterm-smoke; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' webterm-smoke)" = true ] || { docker logs webterm-smoke; exit 1; }
          if docker logs webterm-smoke 2>&1 | grep -q 'Cannot find module'; then docker logs webterm-smoke; echo "missing module at boot" >&2; exit 1; fi
          code="$(docker exec webterm-smoke curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8700/api/health)"
          case "$code" in 200|401|403) ;; *) echo "unexpected /api/health status $code" >&2; exit 1 ;; esac

      - name: Print container logs on failure
        if: failure()
        run: docker logs webterm-smoke || true

      # Multi-arch build + push; the layers come from the cache the smoke build wrote. provenance + sbom
      # are BuildKit attestations pushed with the image (no extra permission needed on GHCR).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
